"$schema" = 'https://starship.rs/config-schema.json'

format = """
$all\
\
$fill\
$time\
\
$line_break\
$jobs\
$battery\
$status\
$os\
$container\
$netns\
$shell\
$nix_shell\
$character"""

# keep-sorted start group_start_regex=['^\['] prefix_order=["[", "[env_var.", "[custom."] newline_separated=yes
[character]
success_symbol = "[->](bold green)"
error_symbol = "[->](bold red)"
vimcmd_symbol = "[<-](bold green)"
vimcmd_replace_one_symbol = "[<-](bold purple)"
vimcmd_replace_symbol = "[<-](bold purple)"
vimcmd_visual_symbol = "[<-](bold yellow)"

[docker_context]
disabled = true

[fill]
symbol = " "

[gcloud]
disabled = true

[git_branch]
disabled = true

[git_commit]
disabled = true

[hostname]
ssh_only = true
ssh_symbol = ""
style = "bold green"
format = '@[$ssh_symbol$hostname]($style) in '

[nix_shell]
disabled = false
heuristic = true
symbol = "❄️"
format = '[$symbol]($style) '

[shell]
disabled = false
fish_indicator = ""
zsh_indicator = "% "
format = '[$indicator]($style)'

[time]
disabled = false
style = ""
time_format = "%a %b %d  %H:%M:%S"
format = '[$time]($style) '

[username]
style_user = "bold yellow"
format = '[$user]($style)'

[env_var.ZMX_SESSION]
symbol = "󰬇 "
format = "[$symbol$env_value]($style) "
description = "zmx session name"
style = "bold blue"

[custom.jj]
when = "jj-starship detect"
shell = "jj-starship"
format = "$output "
# keep-sorted end

# begin overridden sections

# keep-sorted start group_start_regex=['^\['] prefix_order=["[", "[env_var.", "[custom."] newline_separated=yes
[directory]
truncate_to_repo = false
style = "bold blue"
repo_root_style = "bold cyan"
repo_root_format = '[$before_root_path]($style)[\[$repo_root\]]($repo_root_style)[$path]($style)[$read_only]($read_only_style) '

[git_status]
disabled = false
format = '([$all_status$ahead_behind]($style))'
conflicted = "=$count "
ahead = "⇡$count "
behind = "⇣$count "
diverged = "⇡${ahead_count}⇣${behind_count}"
untracked = "[?$count](blue) "
stashed = "*$count "
modified = "[!$count](yellow) "
staged = "[++$count](green) "
renamed = "»$count "
deleted = "[✘$count](red) "
style = "green"
# keep-sorted end
