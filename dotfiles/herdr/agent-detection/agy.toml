id = "agy"
version = "2026.10.05.1"
min_engine_version = 1
updated_at = "2026-10-05T00:00:00Z"
aliases = ["antigravity", "antigravity-cli"]

# Local override of herdr's bundled agy manifest.
#
# Base: herdrdev/herdr v0.9.4 src/detect/manifests/antigravity.toml
# (2026.10.05.1), copied verbatim.
# Added: background_tasks_working, adapted from connorpanso's herdr_workspace
# (//depot/google3/experimental/users/connorpanso/herdr_workspace/).
#
# A local override replaces the whole manifest and shadows remote updates from
# herdr.dev. When `herdr server agent-manifests` reports a newer remote agy
# version, re-copy the upstream rules and keep the extra rule below.
#
# Upstream evidence notes (Antigravity CLI 1.2.17):
#   permission: "↑/↓ Navigate · tab Amend · ctrl+g edit/expand command"
#   question:   "↑/↓ Navigate · enter Select · esc Skip"
#   trust:      "↑/↓ Navigate · enter Confirm"
#   working:    braille spinner above the prompt box, "esc to cancel" footer
#   idle:       "? for shortcuts" footer
#   background tasks/subagents: "· N task(s)" in the footer

[[rules]]
id = "permission_prompt"
state = "blocked"
priority = 300
region = "bottom_non_empty_lines(2)"
visible_blocker = true
contains = ["navigate", "tab amend"]

[[rules]]
id = "question_prompt"
state = "blocked"
priority = 290
region = "bottom_non_empty_lines(2)"
visible_blocker = true
contains = ["navigate", "esc skip"]

[[rules]]
id = "trust_prompt"
state = "blocked"
priority = 280
region = "bottom_non_empty_lines(8)"
visible_blocker = true
contains = ["do you trust the contents of this project?", "yes, i trust this folder", "enter confirm"]

# Pre-1.1.28 permission dialog.
[[rules]]
id = "legacy_permission_prompt"
state = "blocked"
priority = 270
region = "whole_recent"
visible_blocker = true
contains = ["requesting permission for:"]
any = [
  { contains = ["do you want to proceed?"] },
  { contains = ["tab amend", "edit command"] },
]

[[rules]]
id = "esc_cancel_footer_working"
state = "working"
priority = 110
region = "bottom_non_empty_lines(2)"
visible_working = true
regex = ['(?m)^\s*─{3,}\s*esc to cancel\b']

[[rules]]
id = "spinner_working"
state = "working"
priority = 100
region = "bottom_non_empty_lines(12)"
visible_working = true
line_regex = ['^\s*[\u2801-\u28FF]+\s+\S']

# Local addition: keep the pane "working" while background tasks or subagents
# are running, even after agy returns to its prompt. Upstream deliberately
# treats this as idle.
[[rules]]
id = "background_tasks_working"
state = "working"
priority = 90
region = "bottom_non_empty_lines(5)"
visible_working = true
line_regex = ['(?i)·\s*[1-9][0-9]*\s+task']
